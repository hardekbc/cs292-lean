name = "cs292-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Course"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "comparator"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "Course"
